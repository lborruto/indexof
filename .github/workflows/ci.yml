name: CI

# Every push and pull request: the shell and page lint, a secret scan of the whole history, the
# integration test on a throwaway stack, and Trivy on both images and the repository's config
# files. Tags are not pushes here: release.yml calls this workflow on the tagged commit.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push supersedes the running checks of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit of a release at least two weeks old (resolved from its
# tag on 2026-10-31); the comment names the release and the date it was published. Dependabot
# updates the version but not the date; its 14-day cooldown keeps the age rule.
jobs:
  lint:
    name: Lint (shellcheck, sh -n, pages, pwsh, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # rhysd/actionlint release v1.7.12 (2026-03-30), linux_amd64 archive. The checksum is the
      # one in the release's checksums.txt; the download is verified against it before use.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version: "24"
      # shellcheck and pwsh come with the runner image; shellcheck is installed only if missing.
      - name: Tools
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends shellcheck
          fi
          shellcheck --version
          node --version
          pwsh --version
      - run: sh tests/lint.sh
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          rm "$archive"
      # actionlint also runs shellcheck on every run: script of the workflows.
      - run: |
          "$RUNNER_TEMP/actionlint" -color

  secrets:
    name: Secrets (gitleaks, whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # gitleaks release v8.30.1 (2026-03-21), linux_x64 archive. The checksum is the one in the
      # release's checksums.txt; the download is verified against it before use.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
          # The whole history, every branch: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          cd "$RUNNER_TEMP"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm "$archive"
      # The default rules plus .gitleaks.toml (the test suite's invented secrets). Findings are
      # printed redacted.
      - run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 --config .gitleaks.toml .

  test:
    name: Integration (both images, throwaway stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      # Built here first so a broken Dockerfile fails fast and the test stack's build hits the
      # cache; the runner's default builder loads the images into the local daemon.
      - name: Build both images
        run: |
          docker buildx build --load --tag indexof:ci web
          docker buildx build --load --tag indexof-helper:ci helper
      - run: docker compose version && python3 --version
      - run: sh tests/integration.sh

  scan:
    name: Scan (Trivy on both images and the config files)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - name: Build both images
        run: |
          docker buildx build --load --tag indexof:ci web
          docker buildx build --load --tag indexof-helper:ci helper
      # Fixable HIGH and CRITICAL vulnerabilities fail the job; unfixed ones are reported only.
      - name: Trivy on indexof
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (2026-04-22)
        with:
          scan-type: image
          image-ref: indexof:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy on indexof-helper
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (2026-04-22)
        with:
          scan-type: image
          image-ref: indexof-helper:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      # Misconfigurations in the Dockerfiles and the compose file.
      - name: Trivy on the repository's config files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (2026-04-22)
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
