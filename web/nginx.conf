# nginx's main settings for the files page (the unprivileged image's, with the page's routes
# from site.conf.template, which the entrypoint renders into /tmp with the password filled in).
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Uploads arrive in a hidden folder of share itself (same disk), so finishing one is a rename,
    # not a second copy; nginx deletes what a cancelled upload left there.
    client_body_temp_path /srv/share/.uploads;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    include /tmp/site.conf;
}
