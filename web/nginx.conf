# nginx's main settings for the page (the unprivileged image's, with the page's routes from
# site.conf.template, which the entrypoint renders into /tmp with the secrets filled in).
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Uploads arrive in a hidden .uploads folder of the writable folder itself (same disk, set
    # per folder in /tmp/mounts.conf), so finishing one is a rename, not a second copy; nginx
    # deletes what a cancelled upload left there. Anything else that needs a temporary file: /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    include /tmp/site.conf;
}
