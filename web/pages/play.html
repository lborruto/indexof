<html>
<head><title>Play</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* A phone: the same page, its lines wrapped to the width, the links big enough for a finger. */
@media (max-width: 700px) {
  h1 { font-size: 1.5em; overflow-wrap: anywhere; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  pre a { display: inline-block; padding: 8px 0; }
  #pn, #pl2 { white-space: nowrap; }
  #tx { font-size: 14px; }
  select { max-width: 100%; font-size: 16px; }
  input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; }
}
</style></head>
<body>
<h1 id="t">Play</h1>
<pre><a id="raw" href="#" target="_blank" rel="noopener">[raw]</a> <a id="get" href="#" download>[download]</a> <a id="up" href="#">[folder]</a>    <span id="pn"></span><label id="pl2" hidden>  <input type="checkbox" id="auto" checked> play next</label></pre><hr>
<video id="v" controls autoplay style="max-width: 100%; max-height: 80vh; background: #000" hidden></video>
<audio id="au" controls autoplay style="width: 100%" hidden></audio>
<img id="im" style="max-width: 100%; max-height: 85vh" alt="" hidden>
<pre id="tx" style="white-space: pre-wrap" hidden></pre>
<pre id="rs" hidden></pre>
<pre id="c" hidden><a href="#" id="pp">pause</a>  <input type="range" id="sk" min="0" max="0" step="1" value="0" style="width: 50%; vertical-align: middle">  <span id="tm"></span></pre>
<pre id="tracks" hidden>Audio: <select id="as" disabled><option value="">-</option></select>  <span id="an"></span>
<span id="sl">Subtitles: <select id="s"><option value="">off</option></select>  <span id="n"></span></span></pre>
<pre id="m"></pre><hr>
<pre><span id="vl" hidden><a href="#" id="ov">open in VLC</a>  <a href="#" id="pl">playlist</a>  <a href="#" id="cv">copy VLC link</a>  </span><a href="#" onclick="history.back(); return false;">back</a></pre>
<div style="text-align: right; font: 12px monospace"><a id="ver" style="color: #888"></a></div>
<script>
// f: a path of this server only (/folder/...), never //other.host/... (which a browser would load from elsewhere).
const f0 = new URLSearchParams(location.search).get('f') || '', f = /^\/[^/\\]/.test(f0) ? f0 : '/', $ = id => document.getElementById(id);
// The kinds, by extension: the listing's own (videos, sound, pictures), then text, shown as it is
// (.ts is a video there, as in the listing: an MPEG transport stream far more often than TypeScript).
const IMAGE = /\.(jpe?g|png|gif|webp|avif|bmp|svg)$/i, AUDIO = /\.(mp3|flac|m4a|aac|ogg|oga|opus|wav|ac3|dts|mka)$/i;
const VIDEO = /\.(mp4|m4v|webm|mkv|mov|ogv|avi|ts|wmv)$/i, TEXT = /\.(txt|md|markdown|log|nfo|srt|vtt|ass|ssa|sub|json|ya?ml|toml|ini|conf|cfg|csv|tsv|xml|sh|py|js|ts|css|html?)$/i;
const kindOf = p => IMAGE.test(p) ? 'image' : AUDIO.test(p) ? 'audio' : VIDEO.test(p) ? 'video' : TEXT.test(p) ? 'text' : '';
const kind = kindOf(f) || 'video', media = kind === 'audio' || kind === 'video';
const v = $(kind === 'audio' ? 'au' : 'v');
const src = location.origin + f.split('/').map(encodeURIComponent).join('/'), q = 'f=' + encodeURIComponent(f);
$('t').textContent = (media ? 'Play: ' : 'View: ') + f;
document.title = f.split('/').pop();
const msg = t => { $('m').textContent = t; }, note = t => { $('n').textContent = t; };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
// Audio Chrome cannot decode (most Blu-ray rips): the picture plays, without sound.
const SILENT = ['ac3', 'eac3', 'dts', 'truehd', 'mlp', 'pcm_bluray', 'pcm_dvd'];

// Never converted. The file as it is (direct), with the browser's own controls; for another
// audio track than the default one, either the browser's own track switch (Chrome has it only
// with the "Experimental Web Platform features" flag) or /_remux: the file repackaged on the fly
// with that track, video and audio copied as they are ("direct stream"), from `off` seconds in,
// with the line of controls above instead (a seek is a new one, from the keyframe at or before
// the chosen time, which /_probe?k= gives, so the clock and the subtitles stay right).
let info = null, mode = 'direct', off = 0, track = 0;
if (kind === 'image') { $('im').hidden = false; $('im').src = src; $('im').onerror = () => msg('This browser cannot show this picture: download it.'); }
else if (kind === 'text') text();
else {
  v.hidden = false; $('tracks').hidden = false; $('vl').hidden = false; $('sl').hidden = kind === 'audio';
  v.src = src;
  v.onerror = () => msg(mode === 'remux'
    ? 'The repackaged file stopped: choose the track again, or open it in VLC.'
    : 'This browser cannot play this file (its ' + kind + ' format):\nopen it in VLC, or download it.');
}
function direct(t) {
  mode = 'direct'; off = 0;
  v.controls = true; $('c').hidden = true;
  v.src = src;
  if (t > 0) v.addEventListener('loadedmetadata', () => { v.currentTime = t; }, { once: true });
  v.play().catch(() => {});
  cues();
}
function remux(t) {
  mode = 'remux'; off = t;
  v.controls = false; $('c').hidden = false; $('sk').max = Math.floor(info.dur); $('sk').disabled = !info.dur;
  v.src = '/_remux?' + q + '&a=' + track + '&t=' + t;
  v.play().catch(() => {});
  cues(); tick();
}
function seek(t) { // in remux mode, to t seconds: a new one from the keyframe at or before it
  t = Math.max(0, info.dur ? Math.min(t, info.dur - 1) : t);
  fetch('/_probe?' + q + '&k=' + t.toFixed(3), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '').then(r => {
    const m = r.match(/^keyframe ([0-9.]+)/m);
    remux(m ? +m[1] : Math.floor(t));
  });
}
// The remux line: play/pause, the seek bar (the time it is dragged to, then a seek once it rests),
// "12:34 / 1:52:10".
let dragging = false, dragT;
function tick() {
  const at = off + v.currentTime;
  if (!dragging) $('sk').value = Math.floor(at);
  $('tm').textContent = fmt(at) + (info.dur ? ' / ' + fmt(info.dur) : '');
  $('pp').textContent = v.paused ? 'play' : 'pause';
}
$('pp').onclick = e => { e.preventDefault(); if (v.paused) v.play().catch(() => {}); else v.pause(); };
$('sk').oninput = () => {
  dragging = true; clearTimeout(dragT);
  $('tm').textContent = fmt(+$('sk').value) + ' / ' + fmt(info.dur);
  dragT = setTimeout(() => { dragging = false; seek(+$('sk').value); }, 500);
};
$('sk').onchange = () => { if (dragging) { clearTimeout(dragT); dragging = false; seek(+$('sk').value); } };
['play', 'pause', 'timeupdate'].forEach(e => v.addEventListener(e, () => { if (mode === 'remux') tick(); }));
$('as').onchange = () => {
  const n = +$('as').value, at = off + v.currentTime, a = info.audio.find(x => x.n === n);
  track = n; say(a);
  if (v.audioTracks && v.audioTracks.length === info.audio.length) { // the browser's own switch
    for (let i = 0; i < v.audioTracks.length; i++) v.audioTracks[i].enabled = i === info.audio.indexOf(a);
    return;
  }
  if (a === played()) direct(at); else seek(at);
};
// The track the file plays as it is: Chrome takes the first one it can decode (measured: an MKV
// with E-AC3 then AAC plays the AAC), whatever the file calls its default.
const played = () => info.audio.find(a => SILENT.indexOf(a.codec) === -1) || info.audio.find(a => a.def) || info.audio[0];
const name = a => (a.lang + ' ' + a.title).trim() + ' (' + a.codec + (a.ch ? ', ' + ({ 1: 'mono', 2: 'stereo', 6: '5.1', 8: '7.1' }[a.ch] || a.ch + 'ch') : '') + ')';
function say(a) { $('an').textContent = SILENT.indexOf(a.codec) !== -1 ? a.codec.toUpperCase() + ': no sound in this browser (open in VLC, below)' : ''; }

// Subtitles: the text tracks inside the file, then the subtitle files next to it (sidecars,
// below), each fetched from /_sub (as WebVTT) when chosen and kept, shown through one track of
// the player's, shifted by `off` in remux mode.
const subs = []; let sub = null, disp = null, seq = 0;
function parse(t) { // WebVTT: [[start, end, text], ...]
  const out = [], secs = s => s.split(':').reduce((a, b) => a * 60 + parseFloat(b.replace(',', '.')), 0);
  t.replace(/\r/g, '').split(/\n\n+/).forEach(b => {
    const l = b.split('\n'), i = l.findIndex(x => x.indexOf('-->') !== -1);
    if (i < 0 || i === l.length - 1) return;
    const m = l[i].match(/([\d:.,]+)\s*-->\s*([\d:.,]+)/);
    if (m) out.push([secs(m[1]), secs(m[2]), l.slice(i + 1).join('\n')]);
  });
  return out;
}
function cues() {
  if (!disp) { if (!sub) return; disp = v.addTextTrack('subtitles', 'Subtitles', ''); }
  disp.mode = 'hidden'; // (its cues are out of reach while it is disabled)
  const cs = disp.cues; while (cs.length) disp.removeCue(cs[0]);
  if (!sub || !sub.cues) { disp.mode = 'disabled'; return; }
  sub.cues.forEach(([a, b, t]) => { if (b > off && b > a) disp.addCue(new VTTCue(Math.max(0, a - off), b - off, t)); });
  disp.mode = 'showing';
}
$('s').onchange = () => {
  const s = $('s').value === '' ? null : subs[+$('s').value], n = ++seq;
  sub = s;
  if (!s || s.cues) { cues(); return; }
  note(s.file ? 'loading subtitles…' : 'loading subtitles… (the whole file is read for them: a few seconds on a big one)');
  fetch(s.file ? '/_sub?f=' + encodeURIComponent(s.file) + '&s=file' : '/_sub?' + q + '&s=' + s.n, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '').then(t => {
    s.cues = parse(t); note(s.cues.length ? '' : 'no subtitles in that ' + (s.file ? 'file' : 'track'));
    if (seq === n) cues();
  });
};

// VLC plays what a browser cannot (AC3, DTS...): a playlist holding a temporary link to the file
// (/_vlc: that file only, reading only, 12 hours), which VLC opens; or the link itself, for VLC's
// File > Open Network. In Chrome's downloads, "Always open files of this type" makes the next
// playlists open VLC straight away.
function vlcLink() {
  return fetch('/_vlc?' + q, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    t = t.trim();
    if (!/^e=\d+&k=[\w-]+$/.test(t)) { msg('No VLC link (' + (t || 'server error') + ').'); return null; }
    // (Fully encoded, ( ) ' ! * too: the VLC Link helper takes nothing a shell could read otherwise.)
    return location.origin + (p => p.split('/').map(x => encodeURIComponent(x).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase())).join('/'))(f) + '?' + t;
  });
}
// vlc://: opens VLC itself, on a computer with the VLC Link helper (vlc-link/ in the project: it
// hands VLC the http link inside, from the addresses it was installed with only).
$('ov').onclick = e => {
  e.preventDefault();
  vlcLink().then(url => {
    if (!url) return;
    v.pause();
    location.href = 'vlc://' + url.replace(/^http:\/\//, ''); // (without http: Chrome rewrites vlc://http://... as vlc://http//...)
    msg('Opening VLC… (nothing happens? this computer needs the VLC Link helper (vlc-link/ in the project),\nor use "playlist")');
  });
};
$('pl').onclick = e => {
  e.preventDefault();
  vlcLink().then(url => {
    if (!url) return;
    const a = document.createElement('a'), nm = f.split('/').pop();
    a.href = URL.createObjectURL(new Blob(['#EXTM3U\n#EXTINF:-1,' + nm + '\n' + url + '\n'], { type: 'audio/x-mpegurl' }));
    a.download = nm.replace(/\.[^.]*$/, '') + '.m3u';
    document.body.append(a); a.click(); a.remove();
    v.pause();
    msg('VLC playlist downloaded: open it.\nIn Chrome\'s downloads, "Always open files of this type" opens VLC by itself next time.');
  });
};
$('cv').onclick = e => {
  e.preventDefault();
  vlcLink().then(url => {
    if (!url) return;
    const t = document.createElement('textarea'); t.value = url; document.body.append(t); t.select(); document.execCommand('copy'); t.remove();
    msg('VLC link copied (valid 12 hours):\nin VLC, File > Open Network, paste.');
  });
};

// What is in the file: its audio tracks to choose from (the one it plays as it is, first), and
// its subtitle tracks.
if (media) fetch('/_probe?' + q, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '').then(t => {
  const i = { dur: 0, video: '', audio: [] };
  t.split('\n').forEach(l => {
    const w = l.split(' ');
    if (w[0] === 'duration') i.dur = parseFloat(w[1]) || 0;
    else if (w[0] === 'video') i.video = w[1] || '';
    else if (w[0] === 'audio' && w.length >= 6) i.audio.push({ n: +w[1], codec: w[2], lang: w[3], ch: +w[4], def: w[5] === '1', title: w.slice(6).join(' ') });
    else if (w[0] === 'sub' && w.length >= 6) {
      const s = { n: +w[1], codec: w[2], lang: w[3], image: w[4] === 'image', title: w.slice(6).join(' ') }, o = document.createElement('option');
      o.value = subs.length; subs.push(s);
      o.textContent = (s.lang + ' ' + s.title).trim() + (s.image ? ' (image subtitles, cannot be shown)' : ' (' + s.codec + ')');
      o.disabled = s.image;
      $('s').insertBefore(o, $('s').querySelector('option[data-file]')); // (before the subtitle files, if they came first)
    }
  });
  if (!i.audio.length) return;
  info = i;
  const sel = $('as');
  sel.textContent = '';
  i.audio.forEach(a => {
    const o = document.createElement('option');
    o.value = a.n;
    o.textContent = name(a) + (SILENT.indexOf(a.codec) !== -1 ? ', no sound here' : '');
    sel.append(o);
  });
  track = played().n; sel.value = track; say(played());
  // Another track needs the video (remux) or the browser's own switch.
  sel.disabled = i.audio.length < 2 || (!i.video && !v.audioTracks);
});

// The version, in the corner (from /_settings): indexof X.Y.Z, linking to its release; another
// build (main, dev) links to the project.
fetch('/_settings', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null).then(s => {
  const v = s && s.version; if (!v) return;
  $('ver').textContent = 'indexof ' + v;
  $('ver').href = 'https://github.com/lborruto/indexof' + (/^\d+\.\d+\.\d+$/.test(v) ? '/releases/tag/v' + v : '');
});

// GitHub's links: the file as the server gives it (a browser shows what it can, in a new tab),
// the same to save, and its folder.
const dir = f.replace(/[^/]*$/, ''), enc = p => p.split('/').map(encodeURIComponent).join('/');
$('raw').href = src; $('get').href = src; $('get').download = f.split('/').pop(); $('up').href = enc(dir);

// This browser's memory (localStorage), for the "play next" choice and where each file was left:
// a convenience only, so the page works the same without it (private window, blocked storage).
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const keep = (k, x) => { try { localStorage.setItem(k, x); } catch (e) {} };
const drop = k => { try { localStorage.removeItem(k); } catch (e) {} };

// Previous / next: the other files of this kind in the folder, by name as a person sorts them
// (2 before 10, é with e), from the folder's own listing. Pictures and text go round; sound and
// videos stop at the ends, and play on to the next one when "play next" is on.
let others = [], at = -1;
const round = !media;
const prev = () => at > 0 ? others[at - 1] : round && others.length > 1 ? others[others.length - 1] : null;
const next = () => at >= 0 && at < others.length - 1 ? others[at + 1] : round && others.length > 1 ? others[0] : null;
const play = p => '/_play?f=' + encodeURIComponent(p);
fetch(enc(dir), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '').then(t => {
  const base = location.origin + enc(dir), all = [];
  // (The listing's links only: not ../, folders (a trailing /), hidden files, the line under it.)
  new DOMParser().parseFromString(t, 'text/html').querySelectorAll('pre a[href]').forEach(a => {
    let p;
    try { p = decodeURIComponent(new URL(a.getAttribute('href'), base).pathname); } catch (e) { return; }
    const n = p.slice(dir.length);
    if (p.startsWith(dir) && n && n.indexOf('/') === -1 && n[0] !== '.' && all.indexOf(n) === -1) all.push(n);
  });
  all.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
  const names = all.filter(n => kindOf(n) === kind);
  if (kind === 'video') sidecars(all);
  others = names.map(n => dir + n); at = others.indexOf(f);
  if (at < 0 || others.length < 2) return;
  const pn = $('pn'), link = (label, p) => {
    if (!p) return document.createTextNode(' '.repeat(label.length)); // (the counter stays in place)
    const a = document.createElement('a'); a.href = play(p); a.textContent = label; a.title = p.split('/').pop(); return a;
  };
  pn.append(link('[← prev]', prev()), ' ' + (at + 1) + ' / ' + others.length + ' ', link('[next →]', next()));
});
// Subtitle files next to a video "Movie.mkv": Movie.srt, Movie.fr.srt, Movie.en.forced.srt, and
// the same in .vtt, .ass, .ssa; in the list after the file's own tracks, as "fr (file)",
// "en forced (file)" or "file". /_sub converts them (s=file).
function sidecars(all) {
  // (The name's case aside, movie.srt for Movie.mkv; a language in any script, Movie.français.srt.)
  const stem = (f.split('/').pop().replace(/\.[^.]*$/, '') + '.').toLowerCase();
  all.forEach(n => {
    const m = n.toLowerCase().startsWith(stem) && n.slice(stem.length).match(/^(?:([\p{L}\p{N}_-]{1,20})\.)?(?:([\p{L}\p{N}_-]{1,20})\.)?(srt|vtt|ass|ssa)$/iu);
    if (!m) return;
    const o = document.createElement('option'), l = [m[1], m[2]].filter(Boolean).join(' ');
    o.value = subs.length; subs.push({ file: dir + n });
    o.dataset.file = '1'; o.title = n;
    o.textContent = l ? l + ' (file)' : 'file';
    $('s').append(o);
  });
}
// The arrow keys too, except where they already mean something: on the player (it seeks), in
// the controls (the track lists, the seek bar), and with a modifier (Alt+← is the browser's back).
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.defaultPrevented) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const a = document.activeElement;
  if (a && (a === v || /^(AUDIO|VIDEO|INPUT|SELECT|TEXTAREA|BUTTON)$/.test(a.tagName))) return;
  const p = e.key === 'ArrowLeft' ? prev() : next();
  if (p) { e.preventDefault(); location.href = play(p); }
});

// Sound and videos: "play next" (remembered), and where each file was left. The position kept is
// the one in the file (off + currentTime: the repackaged stream starts at `off`), every 5 s while
// playing and when the page goes; not before the saved one is used (a 0 would replace it); the
// 200 latest only. Kept from 30 s in to a minute before the end: past that, the file is done.
const POS = 'indexof:pos:', mine = POS + f;
const where = () => off + v.currentTime, dur = () => info && info.dur || (isFinite(v.duration) ? v.duration : 0);
const saved = () => { try { const o = JSON.parse(load(mine)); return typeof o === 'number' ? o : o && +o.t || 0; } catch (e) { return 0; } };
let ready = false;
function remember() {
  if (!ready) return;
  const t = where(), d = dur();
  if (t <= 30 || !d || t >= d - 60) { drop(mine); return; }
  keep(mine, JSON.stringify({ t: Math.floor(t), at: Date.now() }));
  try { // the oldest beyond 200 go
    const all = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(POS)) { let a = 0; try { a = JSON.parse(localStorage.getItem(k)).at || 0; } catch (e) {} all.push([k, a]); } }
    all.sort((x, y) => y[1] - x[1]).slice(200).forEach(([k]) => localStorage.removeItem(k));
  } catch (e) {}
}
if (media) {
  $('pl2').hidden = false;
  $('auto').checked = load('indexof:playnext') !== '0';
  $('auto').onchange = () => keep('indexof:playnext', $('auto').checked ? '1' : '0');
  // (Once the file's length is known: the first load is always the file as it is, from 0.)
  v.addEventListener('loadedmetadata', () => {
    const s = saved(), d = dur();
    if (mode === 'direct' && s > 30 && s < d - 60) {
      v.currentTime = s;
      const rs = $('rs'), a = document.createElement('a');
      a.href = '#'; a.textContent = '[start over]';
      a.onclick = e => { e.preventDefault(); drop(mine); rs.hidden = true; if (mode === 'remux') seek(0); else v.currentTime = 0; };
      rs.textContent = 'resumed at ' + fmt(s) + ' — '; rs.append(a); rs.hidden = false;
    } else if (s) drop(mine);
    ready = true;
  }, { once: true });
  setInterval(() => { if (!v.paused) remember(); }, 5000);
  addEventListener('pagehide', remember);
  v.addEventListener('ended', () => {
    drop(mine);
    const n = next();
    if (n && $('auto').checked) location.href = play(n);
  });
}

// Text: the file's first 1 MiB (a range: the server sends that much only), shown as it is,
// never as a page (HTML, Markdown, SVG: their source). UTF-8, or else Windows-1252 (old .nfo and
// .srt files); a character cut at 1 MiB is left out, not taken for a wrong encoding.
function text() {
  const MiB = 1048576, tx = $('tx');
  tx.hidden = false;
  fetch(src, { headers: { Range: 'bytes=0-' + (MiB - 1) }, cache: 'no-store' }).then(r => {
    if (r.status === 416) return [new ArrayBuffer(0), 0]; // (a range past the end: an empty file, on servers that answer so; nginx sends 200 and nothing)
    if (!r.ok) throw new Error(r.status);
    const m = (r.headers.get('Content-Range') || '').match(/\/(\d+)$/);
    return r.arrayBuffer().then(b => [b, m ? +m[1] : b.byteLength]);
  }).then(([b, size]) => {
    const bytes = new Uint8Array(b, 0, Math.min(b.byteLength, MiB)), cut = size > bytes.length;
    let t;
    try { t = new TextDecoder('utf-8', { fatal: true }).decode(bytes, { stream: cut }); }
    catch (e) { t = new TextDecoder('windows-1252').decode(bytes); }
    tx.textContent = t;
    if (cut) {
      const a = document.createElement('a'); a.href = src; a.textContent = '[raw]';
      $('m').textContent = 'first 1 MiB shown — '; $('m').append(a, ' for the whole file');
    }
  }).catch(() => msg('This file could not be read: download it.'));
}
