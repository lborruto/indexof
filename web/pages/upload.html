<style>

@media (max-width: 700px) {

  pre a { display: inline-block; padding: 5px 0; }

  .r input[type=checkbox] { margin-right: 9px; }
  input, button, select { font-size: 16px; }
  button, input[type=file] { font-size: 14px; }

/* (A narrower phone: the links a little smaller and closer, five still on one line.) */
@media (max-width: 370px) {

  const input = document.getElementById('f'), files = [...input.files];

}
function upload(files) {
  let box = document.getElementById('ups');

    box = document.createElement('pre'); box.id = 'ups';
    box.innerHTML = '<span id="ut"></span>  <a href="#" id="ua">[cancel all]</a>\n';
    document.getElementById('w').closest('pre').after(box);

  }

    name.textContent = (n.length > 50 ? n.slice(0, 47) + '..>' : n).padEnd(51) + human(file.size).padStart(8) + '  ';
    j.st = document.createElement('span'); j.st.textContent = 'queued';

// A whole folder (picked with Upload folder, or dropped): its folders made first, parents before
// their own (one there already is fine: 405), empty ones too, then its files through the queue.
// Hidden names (a part starting with a dot) are left out and counted; a name the server would
// refuse (a line break, a control character) is left out and named; so is a folder not made.
function upFolder() {

  input.value = '';
  if (files.length) upTree(files, [], 0);
}
async function upTree(files, dirs, hidden) {
  const bad = [], keep = [], made = new Set();
  const ok = p => { const parts = p.split('/'); if (parts.some(x => x.startsWith('.'))) { hidden++; return false; } if (/[\x00-\x1f\x7f]/.test(p)) { bad.push(p); return false; } return true; };
  dirs.filter(ok).forEach(d => made.add(d));
  files.forEach(f => { const p = relOf(f); if (!ok(p)) return; keep.push(f); p.split('/').slice(0, -1).forEach((x, i, a) => made.add(a.slice(0, i + 1).join('/'))); });
  const n = x => x.toLocaleString('en');
  if (keep.length > 1000 && !confirm('Upload ' + n(keep.length) + ' files in ' + n(made.size) + ' folders?')) return;
  const say = failed => msg([hidden ? hidden + ' hidden left out (names starting with a dot)' : '', bad.length ? 'refused (a line break or control character): ' + bad.join(', ') : '', failed.length ? 'folders not made: ' + failed.join(', ') : ''].filter(x => x).join('; '));
  say([]);
  const failed = [];
  preparing++;
  for (const d of [...made].sort((a, b) => a.split('/').length - b.split('/').length)) {
    const r = await fetch(location.pathname + enc(d) + '/', { method: 'MKCOL' }).catch(() => null);
    if (!r || (!r.ok && r.status !== 405)) failed.push(d + ' (' + (r ? r.status : 'network error') + ')');
  }
  preparing--;
  say(failed);
  if (keep.length) upload(keep); else if (made.size > failed.length && jobs.every(x => x.over)) location.reload();
}
// A dropped folder, read whole: its files (each with its path, a/b/c.txt) and its folders. A
// reader hands its entries a hundred or so at a time: read until it hands none. Hidden ones are
// counted and not opened.
async function walk(entries) {
  const files = [], dirs = [];
  let hidden = 0;
  const read = r => new Promise((ok, ko) => r.readEntries(ok, ko)), file = e => new Promise((ok, ko) => e.file(ok, ko));
  const go = async (entry, path) => {
    if (entry.name.startsWith('.')) { hidden++; return; }
    if (entry.isFile) { const f = await file(entry); f.rel = path; files.push(f); return; }
    dirs.push(path);
    const r = entry.createReader();
    for (let got; (got = await read(r)).length;) for (const e of got) await go(e, path + '/' + e.name);
  };
  for (const e of entries) await go(e, e.name);
  return { files, dirs, hidden };
}
async function mk() {
  const n = prompt('Folder name');
  if (!n) return;
  const r = await fetch(location.pathname + encodeURIComponent(n) + '/', { method: 'MKCOL' });
  if (r.ok) location.reload(); else msg('failed (' + r.status + ')');
}
// Drag and drop: files dropped on the page go up as if picked, in a folder where the upload line
// shows, and a folder whole (walk(), upTree()). Anywhere else a drop does nothing, rather than the
// browser leaving the page to open the file. Anything else dragged (text into the search box,
// say) is left to the browser.
const droppable = () => !searching && settings.mounts[mountOf(here)] === 'rw';
let dragOff = 0;
const dragsFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
document.addEventListener('dragover', e => {
  if (!dragsFiles(e)) return;
  e.preventDefault();
  const files = droppable();
  e.dataTransfer.dropEffect = files ? 'copy' : 'none';
  if (!files) return;
  // (A dashed outline while files are over the page; dragover comes every few ms, so its end is
  // when they stop coming: leaving the window or dropping.)
  document.body.style.outline = '2px dashed #888'; document.body.style.outlineOffset = '-4px';
  clearTimeout(dragOff); dragOff = setTimeout(() => { document.body.style.outline = ''; }, 300);
});
document.addEventListener('drop', e => {
  if (!dragsFiles(e)) return;
  e.preventDefault();
  clearTimeout(dragOff); document.body.style.outline = '';

  const files = [], folders = [];
  // (The entries are taken now: the list is emptied once the event is over.)
  const items = e.dataTransfer.items ? [...e.dataTransfer.items].filter(i => i.kind === 'file') : null;
  if (items) items.forEach(i => {
    const entry = i.webkitGetAsEntry && i.webkitGetAsEntry(), f = entry && entry.isDirectory ? null : i.getAsFile();
    if (entry && entry.isDirectory) folders.push(entry); else if (f) files.push(f);
  });

  if (files.length) upload(files);
  if (!folders.length) return;
  preparing++;

});
// Pasted (a screenshot, say): the files the clipboard holds go up as if dropped. A picture with
// no name of its own (image.png) gets the time it was pasted: Pasted 2026-10-31 18.42.05.png,
// with (2), (3)... after a name already here. Pasted while typing (the search box), or text, it
// is left to the browser.
const typing = el => el && (el.isContentEditable || el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit|reset|range|color|image|hidden)$/.test(el.type)));

  if (!droppable() || !e.clipboardData || typing(document.activeElement)) return;
  let files = [...e.clipboardData.files];
  if (!files.length && e.clipboardData.items) files = [...e.clipboardData.items].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(f => f);
  if (!files.length) return;
  e.preventDefault();
  const taken = new Set(rows.map(r => r.path.replace(/\/$/, '').split('/').pop()).concat(jobs.map(j => relOf(j.file))));
  const d = new Date(), p = x => String(x).padStart(2, '0');
  const at = 'Pasted ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + '.' + p(d.getMinutes()) + '.' + p(d.getSeconds());
  upload(files.map(f => {
    if (f.name && !/^image\.\w+$/i.test(f.name)) return f;
    const ext = (f.name.match(/\.\w+$/) || [f.type.startsWith('image/') ? '.' + f.type.slice(6).replace('jpeg', 'jpg').replace(/\W.*/, '') : ''])[0];
    let name = at + ext;
    for (let i = 2; taken.has(name); i++) name = at + ' (' + i + ')' + ext;
    taken.add(name);
    return new File([f], name, { type: f.type, lastModified: f.lastModified });
  }));
});
